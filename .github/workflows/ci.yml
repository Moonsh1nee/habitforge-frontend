name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://getgrip.ru/api

  # E2E tests need a live backend (Postgres/Redis) and are not run on every
  # push. Run them locally against a running backend — see README "E2E tests".
  # A dedicated workflow wiring up the backend + Postgres + Redis services
  # can be added once the project is ready to run e2e in CI.
